name: Sync Upstream & Deploy

# 作用：每天自动把 cmliu/edgetunnel 的更新合并到本 fork，并（可选）直接部署到 Cloudflare。
# 触发方式：定时 / 手动 / 本仓库 main 有推送时。
on:
  schedule:
    - cron: "10 0 * * *"   # 每天 00:10 UTC = 北京时间 08:10
  workflow_dispatch:      # 手动运行 = 同步 + 强制部署一次（首次安装用它验证）
  push:
    branches: [ main ]

permissions:
  contents: write

# 防止定时任务和手动运行撞车
concurrency:
  group: sync-deploy
  cancel-in-progress: false

env:
  UPSTREAM_REPO: cmliu/edgetunnel
  UPSTREAM_BRANCH: main
  # 下面三个用「仓库变量」(Settings > Secrets and variables > Actions > Variables) 覆盖，不填则用默认值
  PAGES_PROJECT: ${{ vars.PAGES_PROJECT_NAME || 'edgetunnel' }}
  WORKER_NAME: ${{ vars.WORKER_NAME || 'edgetunnel' }}
  DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET || 'pages' }}   # pages / workers / none
  CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  sync-deploy:
    runs-on: ubuntu-latest
    steps:
      # ---------- 1. 同步上游 ----------
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync from upstream
        id: sync
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git remote get-url upstream >/dev/null 2>&1; then
            git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          fi
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"

          before="$(git rev-parse HEAD)"
          if git merge-base --is-ancestor "upstream/${UPSTREAM_BRANCH}" HEAD; then
            echo "上游无新提交，跳过合并"
          else
            echo "检测到上游更新："
            git log --oneline "HEAD..upstream/${UPSTREAM_BRANCH}" | head -30
            # 用 merge 而不是 reset --hard，保证本文件及你自身的改动不会被冲掉
            if ! git merge --no-edit "upstream/${UPSTREAM_BRANCH}"; then
              echo "::error::合并上游时发生冲突。请到 GitHub 仓库页点 'Sync fork' 手动解决冲突，再重跑本工作流。"
              exit 1
            fi
            git push origin "HEAD:main"
          fi

          after="$(git rev-parse HEAD)"
          echo "sha=${after}" >> "$GITHUB_OUTPUT"
          echo "short=${after:0:7}" >> "$GITHUB_OUTPUT"

          # 只有「定时触发 且 上游无更新」时才跳过部署；手动推送/手动运行一律部署
          if [ "$before" = "$after" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      # ---------- 2. 准备上传目录 ----------
      # Pages 的 advanced mode 要求 _worker.js 位于输出根目录，其余仓库文件不需要上传
      - name: Prepare upload directory
        if: steps.sync.outputs.deploy == 'true'
        run: |
          mkdir -p .upload
          rsync -a --exclude '.git' --exclude '.github' --exclude '.upload' --exclude 'node_modules' ./ .upload/
          echo "----- 待上传内容 -----"
          ls -lh .upload

      # ---------- 3. 部署到 Cloudflare Pages（保留原项目、域名、环境变量、KV 绑定）----------
      - name: Deploy to Cloudflare Pages
        if: steps.sync.outputs.deploy == 'true' && env.CF_TOKEN != '' && env.DEPLOY_TARGET == 'pages'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy .upload \
            --project-name="$PAGES_PROJECT" \
            --branch=main \
            --commit-hash="${{ steps.sync.outputs.sha }}" \
            --commit-dirty=true

      # ---------- 4. 部署到 Cloudflare Workers（可选，需把 DEPLOY_TARGET 设为 workers）----------
      - name: Deploy to Cloudflare Workers
        if: steps.sync.outputs.deploy == 'true' && env.CF_TOKEN != '' && env.DEPLOY_TARGET == 'workers'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 deploy --name "$WORKER_NAME"

      - name: Skipped deploy (no token configured)
        if: steps.sync.outputs.deploy == 'true' && env.CF_TOKEN == ''
        run: |
          echo "::notice::未配置 CLOUDFLARE_API_TOKEN，仅完成上游同步，未执行部署。"
