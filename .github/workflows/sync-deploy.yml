name: Sync Upstream & Deploy

# 作用：每天自动把 cmliu/edgetunnel 的更新合并到本 fork，并（可选）直接部署到 Cloudflare。
# 触发方式：定时 / 手动 / 本仓库 main 有推送时。
on:
  schedule:
    - cron: "10 0 * * *"   # 每天 00:10 UTC = 北京时间 08:10
  workflow_dispatch:      # 手动运行 = 同步 + 强制部署一次（首次安装用它验证）
  push:
    branches: [ main ]

permissions:
  contents: write

# 防止定时任务和手动运行撞车
concurrency:
  group: sync-deploy
  cancel-in-progress: false

env:
  UPSTREAM_REPO: cmliu/edgetunnel
  UPSTREAM_BRANCH: main
  # 下面几个用「仓库变量」(Settings > Secrets and variables > Actions > Variables) 覆盖，不填则用默认值
  PAGES_PROJECT: ${{ vars.PAGES_PROJECT_NAME || 'edgetunnel' }}
  WORKER_NAME: ${{ vars.WORKER_NAME || 'edgetunnel' }}
  # KV_ID 只是兜底：优先用仓库根目录 wrangler.ci.toml 里固定写好的 id
  KV_ID: ${{ vars.KV_NAMESPACE_ID }}
  DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET || 'pages' }}   # pages / workers / none
  CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  sync-deploy:
    runs-on: ubuntu-latest
    steps:
      # ---------- 1. 同步上游 ----------
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync from upstream
        id: sync
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git remote get-url upstream >/dev/null 2>&1; then
            git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          fi
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"

          before="$(git rev-parse HEAD)"
          if git merge-base --is-ancestor "upstream/${UPSTREAM_BRANCH}" HEAD; then
            echo "上游无新提交，跳过合并"
          else
            echo "检测到上游更新："
            git log --oneline "HEAD..upstream/${UPSTREAM_BRANCH}" | head -30
            # 用 merge 而不是 reset --hard，保证本文件及你自身的改动不会被冲掉
            if ! git merge --no-edit "upstream/${UPSTREAM_BRANCH}"; then
              echo "::error::合并上游时发生冲突。请到 GitHub 仓库页点 'Sync fork' 手动解决冲突，再重跑本工作流。"
              exit 1
            fi
            git push origin "HEAD:main"
          fi

          after="$(git rev-parse HEAD)"
          echo "sha=${after}" >> "$GITHUB_OUTPUT"
          echo "short=${after:0:7}" >> "$GITHUB_OUTPUT"

          # 只有「定时触发 且 上游无更新」时才跳过部署；手动推送/手动运行一律部署
          if [ "$before" = "$after" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      # ---------- 2. 准备上传目录 ----------
      # Pages 的 advanced mode 要求 _worker.js 位于输出根目录，其余仓库文件不需要上传
      - name: Prepare upload directory
        if: steps.sync.outputs.deploy == 'true'
        run: |
          mkdir -p .upload
          # 排除 CI 配置文件，避免它被当成静态资源上传后被公开访问
          rsync -a --exclude '.git' --exclude '.github' --exclude '.upload' --exclude 'node_modules' \
                --exclude 'wrangler.ci.toml' ./ .upload/
          echo "----- 待上传内容 -----"
          ls -lh .upload

      # ---------- 3. 部署到 Cloudflare Pages（保留原项目、域名、环境变量、KV 绑定）----------
      - name: Deploy to Cloudflare Pages
        if: steps.sync.outputs.deploy == 'true' && env.CF_TOKEN != '' && env.DEPLOY_TARGET == 'pages'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy .upload \
            --project-name="$PAGES_PROJECT" \
            --branch=main \
            --commit-hash="${{ steps.sync.outputs.sha }}" \
            --commit-dirty=true

      # ---------- 4. 部署到 Cloudflare Workers（可选，需把 DEPLOY_TARGET 设为 workers）----------
      # 绑定来源优先级：仓库里的 wrangler.ci.toml > 仓库变量 KV_NAMESPACE_ID > 报错中止
      - name: Deploy to Cloudflare Workers
        if: steps.sync.outputs.deploy == 'true' && env.CF_TOKEN != '' && env.DEPLOY_TARGET == 'workers'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          # 兼容日期跟随上游 wrangler.toml，避免 wrangler.ci.toml 里的值越用越旧
          COMPAT="$(grep -oE 'compatibility_date[[:space:]]*=[[:space:]]*"[^"]+"' wrangler.toml 2>/dev/null \
                    | head -1 | sed -E 's/.*"([^"]+)"/\1/' || true)"

          # 判断 wrangler.ci.toml 里是否已经填了真正的 KV id（32 位十六进制）
          if [ -f wrangler.ci.toml ] && grep -qE '^[[:space:]]*id[[:space:]]*=[[:space:]]*"[0-9a-fA-F]{32}"' wrangler.ci.toml; then
            echo "绑定来源：仓库内 wrangler.ci.toml（KV 已固定，同步上游不会影响）"
            CFG=wrangler.ci.toml
          elif [ -n "${KV_ID}" ]; then
            echo "绑定来源：仓库变量 KV_NAMESPACE_ID（wrangler.ci.toml 里还没填有效 id，现场生成配置）"
            cp wrangler.toml .wrangler-ci.toml
            grep -q '^keep_vars' .wrangler-ci.toml || printf '\nkeep_vars = true\n' >> .wrangler-ci.toml
            # 关掉 workers.dev：wrangler 在「没有 routes」时默认把它打开，自定义域不算 routes。
            # 必须写在 [[kv_namespaces]] 之前 —— TOML 里表头之后的所有裸键都属于那张表，
            # 写到后面会变成 kv_namespaces.workers_dev 而报「unexpected field」。
            if grep -q '^[[:space:]]*workers_dev' .wrangler-ci.toml; then
              sed -i 's/^[[:space:]]*workers_dev.*/workers_dev = false/' .wrangler-ci.toml
            else
              printf '\nworkers_dev = false\n' >> .wrangler-ci.toml
            fi
            if grep -q '^[[:space:]]*preview_urls' .wrangler-ci.toml; then
              sed -i 's/^[[:space:]]*preview_urls.*/preview_urls = false/' .wrangler-ci.toml
            else
              printf '\npreview_urls = false\n' >> .wrangler-ci.toml
            fi
            # KV 表必须放在最后
            printf '\n[[kv_namespaces]]\nbinding = "KV"\nid = "%s"\n' "$KV_ID" >> .wrangler-ci.toml
            CFG=.wrangler-ci.toml
          else
            echo "::error::找不到有效的 KV 绑定配置。edgetunnel 的后台和订阅依赖 KV，而 wrangler deploy 会用配置里的绑定集【整体替换】线上绑定——不声明 KV 就会把线上已有的绑定删掉。请二选一：① 在仓库根目录的 wrangler.ci.toml 里填好 id（推荐，一次填永久生效）；② 在 Settings → Secrets and variables → Actions → Variables 添加 KV_NAMESPACE_ID。"
            exit 1
          fi

          echo "----- 本次生效的部署配置 -----"
          cat "$CFG"
          echo "----- 目标 Worker 名称: $WORKER_NAME -----"
          if [ -n "$COMPAT" ]; then
            echo "----- 兼容日期（跟随上游）: $COMPAT -----"
            npx --yes wrangler@4 deploy --config "$CFG" --name "$WORKER_NAME" --compatibility-date "$COMPAT"
          else
            npx --yes wrangler@4 deploy --config "$CFG" --name "$WORKER_NAME"
          fi

          # ---- 兜底：强制关闭 workers.dev（生产 + 预览）----
          # 即使配置里写了 workers_dev = false，也再用 API 确认一次，
          # 因为这个开关曾经在每次部署后被重新打开过。
          RES="$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/subdomain" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"enabled":false,"previews_enabled":false}')"
          echo "$RES"
          if echo "$RES" | grep -q '"enabled"[[:space:]]*:[[:space:]]*false'; then
            echo "workers.dev 已关闭（生产 ${WORKER_NAME}.<子域>.workers.dev + 预览域名）"
          else
            echo "::warning::workers.dev 关闭请求未确认，请到面板 设置 → 域和路由 检查"
          fi

      - name: Skipped deploy (no token configured)
        if: steps.sync.outputs.deploy == 'true' && env.CF_TOKEN == ''
        run: |
          echo "::notice::未配置 CLOUDFLARE_API_TOKEN，仅完成上游同步，未执行部署。"
