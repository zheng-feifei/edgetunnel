# =============================================================================
# CI 专用部署配置 —— 只给 GitHub Actions 用，不影响 Cloudflare 面板上的设置
# 放到 fork 仓库的【根目录】，文件名必须叫 wrangler.ci.toml
# =============================================================================
#
# 【为什么要单独一个文件，而不是直接改 wrangler.toml】
#   wrangler.toml 属于上游仓库，cmliu 每次发版都会改它（version、compatibility_date）。
#   你只要在本地动过这个文件，第二天自动同步 merge 上游时就必定冲突，工作流会直接中止。
#   而本文件是 fork 独有的新文件，上游根本不存在，merge 永远不会碰它 ——
#   KV 绑定因此被"固定"下来，同步多少次都不会丢。
#
# 【为什么必须在这里写明 KV】
#   wrangler deploy 的规则是：用配置里的绑定集【整体替换】线上绑定。
#   没有在这里声明的绑定会被静默删除，而且不报错。
#   keep_vars 只保普通变量（ADMIN / UUID / PROXYIP），不保 KV。
#   所以在改成 Workers 部署后，如果这份配置里没有 KV，每次部署完后台和订阅都会失效。
#
# 【怎么用】
#   1. 去 Cloudflare 面板：存储和数据库 → KV → 点开 edgetunnel 用的那个命名空间
#      复制它的 ID（32 位十六进制，形如 0a1b2c3d4e5f67890a1b2c3d4e5f6789）
#      注意是 ID，不是标题/名称
#   2. 把下面 id 那行的占位内容替换掉
#   3. 提交到 fork 的 main 分支
#   之后无论上游怎么更新，这个绑定都在。
# =============================================================================

# Worker 名称：和 GitHub 仓库变量 WORKER_NAME 保持一致；
# 工作流会用 --name 覆盖此值，所以这里写不写都不影响部署结果。
name = "sdfdsfs"

# 入口文件（edgetunnel 只有一个 _worker.js）
main = "_worker.js"

# 兼容日期：工作流每次会从上游 wrangler.toml 读取最新的值并用 --compatibility-date 覆盖，
# 所以这里只是兜底，写死了也不会让代码变旧。
compatibility_date = "2025-11-04"

# 保留面板上手动添加的普通变量（ADMIN、UUID、PROXYIP 等）。
# 不加这行，部署后这些变量会被清空 —— 表现为后台密码失效、节点全部连不上。
keep_vars = true

# -----------------------------------------------------------------------------
# 关掉 workers.dev 域名（生产 xxx.workers.dev + 预览 *-xxx.workers.dev）
#
# wrangler 的判断逻辑是：配置里「没有 routes」时，workers_dev 默认 = true。
# 而自定义域（custom domain）不算 routes，所以每次部署都会被重新打开一次，
# 表现为「一部署完 workers.dev 又出现了」。必须显式写 false。
# preview_urls 同理，不写的话预览域名也会被打开。
# -----------------------------------------------------------------------------
workers_dev = false
preview_urls = false

# -----------------------------------------------------------------------------
# KV 绑定：这是本文件存在的核心目的
# binding 必须叫 KV —— edgetunnel 代码里写死读 env.KV，改名会直接 500
# -----------------------------------------------------------------------------
[[kv_namespaces]]
binding = "KV"
id = "6562009dd91b4bffb118c9ac4e4412cc"

# 如果你有多个 KV（比如订阅单独存一份），可以继续往下加，但通常 edgetunnel 只需要一个：
# [[kv_namespaces]]
# binding = "KV"
# id = "另一个id"
